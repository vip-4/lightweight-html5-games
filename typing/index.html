<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打字练习 (Typing Speed Test) - HTML5 休闲游戏 | 免费在线</title>
  <meta name="description" content="测试打字速度。计时打字，实时计算 WPM 和准确率。多段落可选。" />
  <meta name="keywords" content="打字练习, Typing Test, WPM, HTML5 游戏, 在线小游戏, 休闲游戏" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="打字练习 (Typing Speed Test) - HTML5 休闲游戏" />
  <meta property="og:description" content="测试打字速度，计算 WPM。" />
  <meta property="og:url" content="https://games.vip01.cc.cd/typing/" />
  <meta property="og:image" content="https://games.vip01.cc.cd/img/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://games.vip01.cc.cd/typing/" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>⌨️ 打字练习 (Typing Speed Test)</h1></header>
  <main>
    <div class="controls">
      <label>时长:
        <select id="duration">
          <option value="30">30 秒</option>
          <option value="60" selected>60 秒</option>
          <option value="120">120 秒</option>
        </select>
      </label>
      <button id="start">开始</button>
    </div>
    <div id="text" class="text"></div>
    <textarea id="input" class="input" placeholder="点击开始后在此输入..." disabled></textarea>
    <div class="stats">
      <div>WPM: <b id="wpm">0</b></div>
      <div>准确率: <b id="accuracy">100</b>%</div>
      <div>剩余: <b id="time">60</b>s</div>
      <div>字符: <b id="chars">0</b></div>
    </div>
  </main>
  <footer><a href="../">← 返回游戏中心</a></footer>
  <script src="js/game.js"></script>
</body>
</html>
